<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style2.css">
  <script src="js/functions.js" defer></script>
  <title>Contacto</title>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <button
        type="button"
        class="icon-button menuToggle"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="mainMenu"
      >
        <img src="img/menu.png" alt="" aria-hidden="true">
      </button>

      <a href="index.html" class="brand" aria-label="Ir a inicio">
        <img src="img/images.png" alt="Logo de Adidas">
      </a>

      <button
        type="button"
        class="icon-button cartToggle"
        aria-label="Abrir carrito"
        aria-expanded="false"
        aria-controls="cartPanel"
      >
        <img src="img/cart.png" alt="" aria-hidden="true" class="cartLogo">
      </button>
    </div>

    <nav class="top-nav" role="navigation" aria-label="Navegación principal">
      <a href="index.html">Productos</a>
      <a href="contacto.html" aria-current="page">Contacto</a>
    </nav>
  </header>

  <main class="site-main">
    <section class="page">
      <h1>Contacto</h1>
      <p>Envíanos un mensaje y te respondemos lo antes posible.</p>

      <form class="contact-form" aria-label="Formulario de contacto">
        <div class="form-row">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required />
        </div>

        <div class="form-row">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="form-row">
          <label for="asunto">Asunto</label>
          <input id="asunto" name="asunto" type="text" required />
        </div>

        <div class="form-row">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        </div>

        <button type="submit" class="primary">Enviar</button>
      </form>
    </section>

    <!-- Carrito -->
    <aside class="cart" id="cartPanel" role="dialog" aria-label="Carrito de compras" aria-hidden="true">
      <h2>CARRITO</h2>
      <div id="cart-items" aria-live="polite" aria-label="Productos en el carrito"></div>
      <button type="button" class="icon-button closeCart" aria-label="Cerrar carrito">
        <img src="img/x.svg" alt="" aria-hidden="true">
      </button>
    </aside>

    <!-- Menú -->
    <aside class="menu" id="mainMenu" role="dialog" aria-label="Menú lateral" aria-hidden="true">
      <h2>Menú</h2>
      <button type="button" class="icon-button closeMenu" aria-label="Cerrar menú">
        <img src="img/x.svg" alt="" aria-hidden="true">
      </button>
      <nav class="menu-content" role="navigation" aria-label="Enlaces del menú">
        <a href="index.html">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </aside>
  </main>

  <footer class="site-footer">
    <p>© 2026 - Ecommerce DOM</p>
  </footer>
</body>
</html>
